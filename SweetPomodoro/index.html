<!DOCTYPE html>

<html lang="es" class="h-full">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodoro Rosita - 25:00</title>

    <!-- ========================================== -->

    <!-- SECCIÓN 1: LIBRERÍAS Y ESTILOS CSS          -->

    <!-- ========================================== -->

    <!-- Tailwind CSS for styling -->

    <script src="https://cdn.tailwindcss.com"></script>

    <script>

        tailwind.config = {

            darkMode: 'class',

            theme: {

                extend: {

                    colors: {

                        blush: {

                            50: '#fff1f4',

                            100: '#ffe4e9',

                            200: '#fecdd7',

                            300: '#ffa8b7',

                            400: '#fd7991',

                            500: '#f4436c',

                            600: '#e02454',

                            700: '#bd1841',

                        },

                        pastel: {

                            pink: '#ffd1dc',

                            rose: '#ffb7c5',

                            cream: '#fffaf0',

                            lavender: '#f3e8ff',

                            peach: '#ffe5d9'

                        }

                    }

                }

            }

        }

    </script>

    <!-- Google Fonts Quicksand -->

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="h-full bg-gradient-to-br from-blush-50 via-pink-50 to-pastel-cream text-slate-700 flex flex-col justify-between selection:bg-blush-400 selection:text-white">

    <!-- ========================================== -->

    <!-- SECCIÓN 2: ESTRUCTURA HTML DE LA VISTA     -->

    <!-- ========================================== -->

    <!-- Header / Cabecera -->

    <header class="w-full max-w-xl mx-auto px-6 py-6 flex justify-between items-center">

        <div class="flex items-center space-x-2.5">

            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blush-400 to-blush-500 flex items-center justify-center text-white text-lg shadow-md glow-pink">

                🌸

            </div>

            <div>

                <span class="font-bold text-lg tracking-tight text-slate-800">SweetPomodoro</span>

                <p class="text-xs text-blush-500 font-medium">Estudia con amor ✨</p>

            </div>

        </div>

        <button id="theme-toggle" class="p-3 rounded-2xl bg-white/80 backdrop-blur-md border border-blush-200/60 hover:bg-white hover:scale-105 transition-all shadow-sm text-blush-500 focus:outline-none" aria-label="Cambiar tema">

            <span class="text-lg">💖</span>

        </button>

    </header>

    <!-- Main Content Area / Contenido Principal -->

    <main class="w-full max-w-md mx-auto px-4 flex-1 flex flex-col justify-center items-center pb-12">

        <!-- Mode Tabs / Selector de Modos -->

        <div class="flex bg-white/70 backdrop-blur-md border border-blush-200/50 p-1.5 rounded-3xl mb-8 w-full max-w-xs glow-card">

            <button data-mode="work" class="flex-1 py-2.5 text-xs font-bold rounded-2xl transition-all duration-300 bg-gradient-to-r from-blush-400 to-blush-500 text-white shadow-md shadow-blush-400/30" id="tab-work">Estudio</button>

            <button data-mode="shortBreak" class="flex-1 py-2.5 text-xs font-bold rounded-2xl transition-all duration-300 text-slate-500 hover:text-blush-600" id="tab-shortBreak">Descanso C.</button>

            <button data-mode="longBreak" class="flex-1 py-2.5 text-xs font-bold rounded-2xl transition-all duration-300 text-slate-500 hover:text-blush-600" id="tab-longBreak">Descanso L.</button>

        </div>

        <!-- Timer Circle Container / Círculo del Temporizador -->

        <div class="relative w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center my-2 bg-white/60 backdrop-blur-md rounded-full glow-card border border-blush-100 p-4">

            <svg class="w-full h-full absolute inset-0 p-4" viewBox="0 0 100 100">

                <circle cx="50" cy="50" r="42" class="text-blush-100" stroke-width="5" stroke="currentColor" fill="transparent" />

                <circle id="progress-circle" cx="50" cy="50" r="42" class="progress-ring__circle text-blush-400" stroke-width="5" stroke-dasharray="263.89" stroke-dashoffset="0" stroke-linecap="round" fill="transparent" />

            </svg>

            <div class="absolute flex flex-col items-center text-center z-10">

                <span class="text-2xl mb-1 animate-bounce">🌷</span>

                <span id="timer-display" class="text-5xl sm:text-6xl font-bold tracking-tight mb-1 text-slate-800 font-mono">25:00</span>

                <span id="timer-status" class="text-xs uppercase tracking-wider text-blush-600 font-semibold bg-blush-100/80 px-3 py-1 rounded-full">Momento de Focus</span>

            </div>

        </div>

        <!-- Action Control Buttons / Botones de Control -->

        <div class="flex items-center space-x-4 mt-8 w-full max-w-xs">

            <button id="btn-start" class="flex-1 py-4 px-6 rounded-2xl bg-gradient-to-r from-blush-400 to-blush-500 hover:from-blush-500 hover:to-blush-600 text-white font-bold shadow-lg glow-pink hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center space-x-2">

                <svg id="icon-play" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

                <span id="text-start">Iniciar</span>

            </button>

            <button id="btn-reset" class="p-4 rounded-2xl bg-white/80 backdrop-blur-md border border-blush-200/60 hover:bg-white text-slate-600 hover:text-blush-500 transition-all hover:scale-105 active:scale-95 shadow-sm" title="Reiniciar temporizador">

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

            </button>

        </div>

        <!-- Session Statistics / Jardín de Flores Acumuladas -->

        <div class="mt-8 w-full max-w-xs bg-white/70 backdrop-blur-md border border-blush-200/60 py-4 px-5 rounded-3xl glow-card flex flex-col items-center">

            <div class="flex items-center justify-between w-full mb-2">

                <span class="text-xs font-semibold text-slate-500">Sesiones de hoy:</span>

                <span id="sessions-count" class="text-sm font-bold text-blush-600">0</span>

            </div>

            <div id="flower-garden" class="flex flex-wrap gap-1.5 justify-center min-h-[28px] w-full items-center text-lg">

                <span class="text-xs text-slate-400 italic">¡Completa una sesión para ganar tu primera florecita! 🌸</span>

            </div>

        </div>

    </main>

    <!-- Footer -->

    <footer class="w-full text-center py-4 text-xs text-blush-600 font-medium">

        <p>Hecho con 💗 para inspirar tu estudio diario.</p>

    </footer>

    <!-- Custom Notification Modal -->

    <div id="modal-notification" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">

        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-blush-100 text-center transform scale-95 transition-transform duration-300 glow-card" id="modal-content">

            <div class="w-14 h-14 rounded-2xl bg-blush-100 text-blush-500 flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">

                🎀

            </div>

            <h3 id="modal-title" class="text-lg font-bold mb-2 text-slate-800">¡Tiempo finalizado!</h3>

            <p id="modal-message" class="text-sm text-slate-500 mb-6">Has completado tu sesión de estudio con éxito. ¡Te ganaste una flor!</p>

            <button id="modal-close" class="w-full py-3.5 bg-gradient-to-r from-blush-400 to-blush-500 hover:from-blush-500 hover:to-blush-600 text-white font-semibold rounded-2xl transition-all shadow-md glow-pink">¡Continuar!</button>

        </div>

    </div>

    <!-- ========================================== -->

    <!-- SECCIÓN 3: LÓGICA DE JAVASCRIPT            -->

    <!-- ========================================== -->

    <script src="js/app.js" defer></script>

</body>

</html>
